# ════════════════════════════════════════════════════════════════════════════
#  pg_hba.conf — Host-Based Authentication
#
#  Enforces SSL for ALL TCP connections. Plain TCP connections are rejected.
#  Local Unix-socket connections (used by pg_dump inside the container)
#  are allowed without SSL (they never traverse the network).
# ════════════════════════════════════════════════════════════════════════════

# TYPE  DATABASE  USER      ADDRESS         METHOD
# Local Unix socket — used by pg_dump and psql inside the container
local   all       all                       trust

# IPv4 loopback — require SSL
hostssl all       all       127.0.0.1/32    scram-sha-256

# Docker internal network — require SSL (only Django container reaches here)
hostssl all       all       0.0.0.0/0       scram-sha-256

# Reject any non-SSL TCP connection that somehow reaches this point
host    all       all       0.0.0.0/0       reject
