# ════════════════════════════════════════════════════════════════════════════
#  postgresql.conf — Postgres SSL & hardening overrides
#
#  Mounted into the container at /etc/postgresql/postgresql.conf
#  and referenced via the postgres command flag:
#    postgres -c config_file=/etc/postgresql/postgresql.conf
# ════════════════════════════════════════════════════════════════════════════

# ── SSL ───────────────────────────────────────────────────────────────────────
ssl                       = on
ssl_cert_file             = '/etc/ssl/certs/pg/server.crt'
ssl_key_file              = '/etc/ssl/private/pg/server.key'

# ── Connections ───────────────────────────────────────────────────────────────
# Only accept connections from Docker's internal bridge (defence-in-depth;
# port 5432 is never published to host, but this prevents any future slip)
listen_addresses          = '*'
max_connections           = 100

# ── Logging ───────────────────────────────────────────────────────────────────
log_connections           = on
log_disconnections        = on
log_duration              = off
log_statement             = 'ddl'
log_min_duration_statement = 1000   # log queries taking > 1 s

# ── Performance ───────────────────────────────────────────────────────────────
shared_buffers            = 256MB
work_mem                  = 4MB
maintenance_work_mem      = 64MB
effective_cache_size      = 768MB
