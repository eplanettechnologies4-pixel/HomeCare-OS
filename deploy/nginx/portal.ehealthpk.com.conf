# ════════════════════════════════════════════════════════════════════════════
# Host Nginx Configuration for portal.ehealthpk.com
# Location on VPS: /etc/nginx/sites-available/portal.ehealthpk.com
# Symlink: ln -s /etc/nginx/sites-available/portal.ehealthpk.com /etc/nginx/sites-enabled/
# ════════════════════════════════════════════════════════════════════════════

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name portal.ehealthpk.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS reverse proxy to Docker frontend container (127.0.0.1:3001)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portal.ehealthpk.com;

    # SSL Certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/portal.ehealthpk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.ehealthpk.com/privkey.pem;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Upload file size limit (100MB for medical photos, scans, videos)
    client_max_body_size 100m;

    # Proxy all traffic to the docker frontend container on 127.0.0.1:3001
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # Extended timeouts for long-running WebSockets and media uploads
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;

        # Buffering settings
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
